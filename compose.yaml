services:
  # The app. `docker compose up -d` runs both; for local development run
  # only postgres and `go run ./cmd/mails`.
  mails:
    build: .
    container_name: mails
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://mails:mails@postgres:5432/mails?sslmode=disable
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]

  postgres:
    image: postgres:18-alpine
    container_name: mails-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mails
      POSTGRES_PASSWORD: mails
      POSTGRES_DB: mails
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - mails-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mails -d mails"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mails-pgdata:
