name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit (Docker image tag, or `git rev-parse --short HEAD`).
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Part
      options: [Dashboard, Server / API, Sending (SES), Receiving (Cloudflare worker), Browser extension, Node SDK, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server log lines around the problem. Remove addresses, tokens and mail content first.
      render: text
