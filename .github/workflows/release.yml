# Runs when a GitHub release is published (tag like v1.2.0). It ships:
#   - server binaries (linux/darwin, amd64/arm64) attached to the release, and
#     the image ghcr.io/<owner>/mails (:1.2.0, :1.2, :latest) made from them
#   - the browser extension zips (Chrome, Firefox, Edge) attached to the release
#   - the Node SDK to npm, only when the NPM_TOKEN secret is set
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v1.2.0)
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5437:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web tests and build
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm test && pnpm build
      - name: Go tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5437/postgres?sslmode=disable
        run: go vet ./... && go test ./...

  # Builds every binary once, with Go's build cache. Read-only: this job runs
  # third-party code (pnpm install, the Go build), so it gets no write token.
  binaries:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build dashboard
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Build binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="mails_${TAG#v}_${os}_${arch}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/$name/mails" ./cmd/mails
            tar -C "dist/$name" -czf "dist/$name.tar.gz" mails
            if [ "$os" = linux ]; then mkdir -p "dist/image/linux-$arch" && cp "dist/$name/mails" "dist/image/linux-$arch/"; fi
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/image
          retention-days: 1

  # Publishes what binaries built. It holds the write tokens and runs no
  # build or install, only the official actions and gh.
  publish:
    needs: [binaries, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: Dockerfile.release
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: dist/extension
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt dist/extension/*.zip --clobber --repo "$GITHUB_REPOSITORY"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: dist/image
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Read-only like binaries: builds the zips, publish attaches them.
  extension:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/extension
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Set version from tag
        run: npm pkg set version="${TAG#v}"
      - run: pnpm test
      - name: Zip for Chrome, Firefox and Edge
        run: pnpm zip:all
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: packages/extension/.output/*.zip
          retention-days: 1

  # Builds and packs the SDK without the npm token; sdk-publish publishes
  # the packed tarball, which runs no package scripts.
  sdk:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          pnpm install --frozen-lockfile
          npm pkg set version="${TAG#v}"
          pnpm build
          npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: sdk
          path: packages/sdk/*.tgz
          retention-days: 1

  sdk-publish:
    needs: sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip without NPM_TOKEN
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "NPM_TOKEN is not set; the SDK is not published."
      - uses: actions/download-artifact@v4
        if: env.NODE_AUTH_TOKEN != ''
        with:
          name: sdk
      - uses: actions/setup-node@v4
        if: env.NODE_AUTH_TOKEN != ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - if: env.NODE_AUTH_TOKEN != ''
        run: npm publish ./*.tgz --access public --provenance
