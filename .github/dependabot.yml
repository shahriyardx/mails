version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"] }
  - package-ecosystem: npm
    directories: [/web, /packages/sdk, /packages/extension, /worker]
    schedule: { interval: weekly }
    groups:
      npm-minor:
        update-types: [minor, patch]
    # Major versions (TypeScript 7, postal-mime 4, ...) need code changes:
    # upgrade those by hand, not as weekly PRs.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
