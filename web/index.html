<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16151a" />
    <meta name="color-scheme" content="dark light" />
    <!-- The theme before first paint, so a light page never flashes dark.
         Keep in step with src/lib/theme.ts (same key and values). -->
    <script>
      try {
        var c = localStorage.getItem("mails-theme");
        var t = c === "light" || c === "dark" ? c : c === "system" && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').content = t === "light" ? "#f6f5f9" : "#16151a";
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/material-symbols-rounded.woff2?v=4" as="font" type="font/woff2" crossorigin />
    <title>Mails</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
